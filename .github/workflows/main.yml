      - name: Completar herramientas Android
        run: |
          flutter create --platforms=android --project-name plantilla /tmp/plantilla
          cp -r /tmp/plantilla/android/gradle proyecto/vamos_app/android/
          cp /tmp/plantilla/android/gradlew proyecto/vamos_app/android/
          cp /tmp/plantilla/android/gradlew.bat proyecto/vamos_app/android/
          cp /tmp/plantilla/android/settings.gradle.kts proyecto/vamos_app/android/
          cp /tmp/plantilla/android/build.gradle.kts proyecto/vamos_app/android/
          cp /tmp/plantilla/android/gradle.properties proyecto/vamos_app/android/
          cp /tmp/plantilla/android/local.properties proyecto/vamos_app/android/
          cp /tmp/plantilla/android/app/build.gradle.kts proyecto/vamos_app/android/app/
          sed -i 's/com\.example\.plantilla/com.vamoscarpool.app/g' proyecto/vamos_app/android/app/build.gradle.kts
          chmod +x proyecto/vamos_app/android/gradlew
          
      - name: Instalar dependencias
        working-directory: proyecto/vamos_app
        run: flutter pub get

      - name: Compilar APK de prueba
        working-directory: proyecto/vamos_app
        run: flutter build apk --debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vamos-Android-Prueba
          path: proyecto/vamos_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
