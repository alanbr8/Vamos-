name: Publicar Vamos Web
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: unzip -q Vamos_MVP_Fullstack_1.8.0.zip -d proyecto
      - name: Preparar plataforma web
        run: flutter create --platforms=web --project-name=vamos_app .
        working-directory: proyecto/vamos_app
      - name: Configurar nombre y apariencia
        run: |
          sed -i 's/<title>vamos_app<\/title>/<title>Vamos!! · Carpool Bolivia<\/title>/' web/index.html
          sed -i 's/"name": "vamos_app"/"name": "Vamos!!"/' web/manifest.json
          sed -i 's/"short_name": "vamos_app"/"short_name": "Vamos!!"/' web/manifest.json
          cp assets/brand/app_icon.png web/favicon.png
          cp assets/brand/app_icon.png web/icons/Icon-192.png
          cp assets/brand/app_icon.png web/icons/Icon-512.png
          cp assets/brand/app_icon.png web/icons/Icon-maskable-192.png
          cp assets/brand/app_icon.png web/icons/Icon-maskable-512.png
        working-directory: proyecto/vamos_app
      - run: flutter pub get
        working-directory: proyecto/vamos_app
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: proyecto/vamos_app
      - run: flutter test
        working-directory: proyecto/vamos_app
      - name: Compilar web
        run: flutter build web --release --base-href /Vamos-/ --dart-define=API_BASE_URL=https://vamos-api.onrender.com/api/v1
        working-directory: proyecto/vamos_app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: proyecto/vamos_app/build/web
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
